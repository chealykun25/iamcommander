<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F9F8F5;--surface:#FFFFFF;--s2:#F3F1EA;--s3:#EAE7DC;--ink:#0B0A08;--dim:#4A4740;--faint:#8A8780;--gold:#9A7230;--gold-lt:#C49A42;--gold-pale:rgba(154,114,48,0.07);--gold-b:rgba(154,114,48,0.22);--teal:#0A6358;--teal-pale:rgba(10,99,88,0.07);--teal-b:rgba(10,99,88,0.22);--violet:#3D2FC0;--violet-pale:rgba(61,47,192,0.06);--red:#A81A1A;--red-pale:rgba(168,26,26,0.06);--sage:#186332;--sage-pale:rgba(24,99,50,0.07);--amber:#7A4A00;--amber-pale:rgba(122,74,0,0.07);--amber-b:rgba(122,74,0,0.2);--border:rgba(11,10,8,0.08);--border2:rgba(11,10,8,0.15);--dark:#0B0A08;--cream:#EDE7D8;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;font-size:14px}
.topnav{background:var(--dark);height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid rgba(237,231,216,0.1)}
.tn-brand{font-family:var(--serif);font-size:12px;letter-spacing:.1em;color:var(--cream)}
.tn-tabs{display:flex;gap:2px}
.tn-tab{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:rgba(237,231,216,0.4);padding:5px 12px;cursor:pointer;border:none;border-bottom:1.5px solid transparent;background:none;transition:all .15s}
.tn-tab:hover{color:var(--cream)}.tn-tab.active{color:var(--gold-lt);border-bottom-color:var(--gold-lt)}
.tn-r{font-family:var(--mono);font-size:10px;color:rgba(237,231,216,0.35)}
.pg-head{padding:24px 24px 18px;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:flex-end}
.pg-title-wrap{}.pg-eye{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.pg-title{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--ink)}.pg-title em{color:var(--gold);font-style:italic}
.summary{display:flex;gap:12px}
.sum-item{text-align:center}
.sum-val{font-family:var(--serif);font-size:22px;color:var(--ink);line-height:1}
.sum-label{font-family:var(--mono);font-size:8px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.filter-row{display:flex;gap:5px;padding:12px 24px;border-bottom:0.5px solid var(--border);overflow-x:auto}
.fb{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:0.5px solid var(--border2);cursor:pointer;background:none;color:var(--faint);transition:all .12s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.fb:hover{background:var(--s2)}.fb.active{background:var(--surface);color:var(--ink);border-color:var(--border2);font-weight:500}
.fb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ops-body{padding:16px 24px}
.div-section{margin-bottom:20px}
.div-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:7px;border-bottom:0.5px solid var(--border)}
.dh-dot{width:9px;height:9px;border-radius:50%}.dh-name{font-size:13px;font-weight:400;color:var(--ink);flex:1}
.dh-ct{font-family:var(--mono);font-size:9px;color:var(--faint);padding:2px 7px;background:var(--s2);border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:6px;padding:11px 13px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.card:hover{border-color:var(--border2);background:var(--s2)}.card.open{border-color:var(--border2)}
.card-tb{position:absolute;top:0;left:0;right:0;height:1.5px}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px;margin-top:3px}
.card-code{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--faint)}
.card-badges{display:flex;align-items:center;gap:5px}
.drift-dot{width:6px;height:6px;border-radius:50%}
.badge{font-family:var(--mono);font-size:8px;padding:2px 5px;border-radius:2px}
.st-active{background:var(--sage-pale);color:var(--sage)}
.st-pending{background:var(--amber-pale);color:var(--amber)}
.st-dormant{background:var(--s2);color:var(--faint)}
.card-name{font-size:12px;font-weight:400;color:var(--ink);margin-bottom:4px;line-height:1.3}
.card-kpi{font-family:var(--serif);font-size:18px;color:var(--ink);line-height:1}
.card-ksub{font-family:var(--mono);font-size:8px;color:var(--faint);margin-bottom:7px}
.card-bar{height:2px;background:var(--s3);border-radius:1px;overflow:hidden}
.card-bar-fill{height:100%;border-radius:1px}
.card-detail{display:none;margin-top:9px;padding-top:9px;border-top:0.5px solid var(--border)}
.card.open .card-detail{display:block}
.det-row{display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px}
.det-k{color:var(--faint);font-family:var(--mono);font-size:9px}
.det-v{color:var(--ink);font-weight:400;text-align:right;max-width:65%}
.next-action{margin-top:7px;padding:8px 10px;background:var(--s2);border-radius:4px}
.na-eye{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.na-text{font-size:10px;color:var(--dim);line-height:1.5}
.footer{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--dark);border-top:0.5px solid rgba(237,231,216,0.1)}
.foot-brand{font-family:var(--serif);font-size:12px;letter-spacing:.1em;color:rgba(237,231,216,0.3)}
.foot-tags{display:flex;gap:6px}
.ft{font-family:var(--mono);font-size:9px;padding:3px 9px;border-radius:2px;letter-spacing:.06em}
.ft-n{background:rgba(237,231,216,0.06);color:rgba(237,231,216,0.3)}
.ft-w{background:rgba(168,26,26,0.15);color:rgba(248,113,113,0.8)}
.ft-g{background:rgba(10,99,88,0.15);color:rgba(45,195,175,0.8)}
</style>

];
const sigC={g:'#186332',a:'#7A4A00',r:'#A81A1A'};
const stMap={active:'st-active',pending:'st-pending',dormant:'st-dormant'};
const fRow=document.getElementById('filters'),ops=document.getElementById('ops');
let activeF='all';
function buildFilters(){
  const all=document.createElement('button');all.className='fb active';all.textContent='All divisions';
  all.onclick=()=>setF('all',all);fRow.appendChild(all);
  DIVS.forEach(d=>{
    const b=document.createElement('button');b.className='fb';
    b.innerHTML=`<span class="fb-dot" style="background:${d.color}"></span>${d.name}`;
    b.onclick=()=>setF(d.id,b);fRow.appendChild(b);
  });
}
function setF(id,btn){activeF=id;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderOps();}
function renderOps(){
  ops.innerHTML='';
  const toShow=activeF==='all'?DIVS:DIVS.filter(d=>d.id===activeF);
  toShow.forEach(div=>{
    const sec=document.createElement('div');sec.className='div-section';
    sec.innerHTML=`<div class="div-hd"><div class="dh-dot" style="background:${div.color}"></div><span class="dh-name">${div.name}</span><span class="dh-ct">${div.projects.length}</span></div><div class="cards" id="cg-${div.id}"></div>`;
    ops.appendChild(sec);
    const grid=document.getElementById('cg-'+div.id);
    div.projects.forEach(p=>{
      const c=document.createElement('div');c.className='card';
      c.innerHTML=`<div class="card-tb" style="background:${div.color}"></div><div class="card-hd"><span class="card-code">${p.code}</span><div class="card-badges"><div class="drift-dot" style="background:${sigC[p.drift]}"></div><span class="badge ${stMap[p.status]}">${p.status}</span></div></div><p class="card-name">${p.name}</p><p class="card-kpi">${p.kpi}</p><p class="card-ksub">${p.ksub}</p><div class="card-bar"><div class="card-bar-fill" style="width:${p.bar}%;background:${div.color}"></div></div><div class="card-detail"><div class="det-row"><span class="det-k">Next milestone</span><span class="det-v">${p.milestone}</span></div><div class="det-row"><span class="det-k">Target date</span><span class="det-v">${p.mdate}</span></div><div class="det-row"><span class="det-k">Owner</span><span class="det-v">${p.owner}</span></div><div class="next-action"><p class="na-eye">Next action</p><p class="na-text">${p.action}</p></div></div>`;
      c.onclick=()=>c.classList.toggle('open');
      grid.appendChild(c);
    });
  });
}
buildFilters();renderOps();
function calcD(){return Math.ceil((new Date('2036-06-01')-new Date())/86400000)}
document.getElementById('fd').textContent=calcD()+' D';

<script>
(function(){
  function tick(){
    var n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
    var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var str=h+':'+m+' '+days[n.getDay()];
    document.querySelectorAll('.clock-el,[id="t"],[id="clk"]').forEach(function(e){e.textContent=str;});
  }
  tick(); setInterval(tick, 30000);
  var d=Math.ceil((new Date('2036-06-01')-new Date())/86400000);
  setTimeout(function(){
    document.querySelectorAll('.days-left').forEach(function(e){e.textContent=d+' D';});
    // Fix days in footer tags
    document.querySelectorAll('.ft,.f-tag').forEach(function(e){
      if(e.textContent.match(/\d{4}\s*D/)) e.textContent=d+' D';
    });
  }, 100);
})();
if('serviceWorker'in navigator) navigator.serviceWorker.register('/iamcommander/sw.js').catch(function(){});
</script>

<script>
// Live empire data from Notion (via data.json)
(function(){
  fetch('data.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      // Empire score
      var sc = document.getElementById('rscore') || document.querySelector('.ring-score');
      if(sc) sc.textContent = d.score;

      // Net worth
      document.querySelectorAll('.w-cur,.wealth-current').forEach(function(e){
        e.textContent = d.nw;
      });

      // Progress percentage
      var pct = ((parseFloat(d.nw) / 2800) * 100).toFixed(5) + '%';
      document.querySelectorAll('.prog-pct,.progress-pct').forEach(function(e){
        e.textContent = pct + ' complete';
      });

      // Today action
      var ab = document.querySelector('.ab-text,.action-text');
      if(ab) ab.textContent = d.action;
      var atag = document.querySelector('.ab-tag,.action-tag');
      if(atag) atag.textContent = d.action_div;

      // Phase + burn
      document.querySelectorAll('.phase-label,.phase-tag').forEach(function(e){
        e.textContent = d.phase + ' · ' + d.burn;
      });

      // Redraw ring if function exists
      if(typeof drawRing === 'function') drawRing(d.score);
    })
    .catch(function(){
      // Silently use hardcoded defaults if fetch fails
    });
})();
</script>
