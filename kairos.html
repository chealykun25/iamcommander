<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0906">
<title>Kairos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0A0906;--ink2:#141210;--ink3:#1E1B17;
  --gold:#C9A96E;--ivory:#F5F0E8;--stone:#8A7A60;
  --border:rgba(201,169,110,0.15);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
html,body{height:100%;background:var(--ink);color:var(--ivory);font-family:var(--sans);font-size:17px;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

.topbar{flex-shrink:0;height:52px;background:var(--ink2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px}
.back{font-size:15px;color:var(--stone);background:none;border:1px solid rgba(201,169,110,0.2);border-radius:8px;padding:7px 14px;cursor:pointer;font-family:var(--sans)}
.brand{font-family:var(--serif);font-size:18px;font-weight:300;color:var(--ivory);flex:1;text-align:center}
.brand em{color:var(--gold);font-style:italic}
.modes{display:flex;gap:5px}
.mode{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid rgba(201,169,110,0.2);background:none;color:var(--stone);cursor:pointer;font-family:var(--sans)}
.mode.on{background:rgba(201,169,110,0.15);color:var(--gold);border-color:var(--gold)}

.modnav{flex-shrink:0;display:flex;gap:6px;padding:9px 16px;background:var(--ink2);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.modnav::-webkit-scrollbar{display:none}
.ml{font-size:13px;color:var(--stone);padding:6px 14px;border:1px solid rgba(201,169,110,0.15);border-radius:20px;text-decoration:none;white-space:nowrap}

.chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px 10px;display:flex;flex-direction:column;gap:18px}
.chat::-webkit-scrollbar{width:3px}
.chat::-webkit-scrollbar-thumb{background:rgba(201,169,110,0.15)}

.khead{text-align:center;padding:8px 0 20px;border-bottom:1px solid var(--border);margin-bottom:4px}
.kname{font-family:var(--serif);font-size:34px;font-weight:300;color:var(--ivory);margin:12px 0 5px}
.kname em{color:var(--gold);font-style:italic}
.ksub{font-size:13px;color:var(--stone)}
.laws{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.law{font-size:11px;color:rgba(201,169,110,0.5);padding:3px 9px;border:1px solid rgba(201,169,110,0.15);border-radius:20px}

.msg{display:flex;flex-direction:column;gap:5px}
.msg.me{align-items:flex-end}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(201,169,110,0.4);padding:0 3px}
.msg.me .lbl{color:rgba(245,240,232,0.25)}
.bubble{padding:15px 17px;border-radius:14px;line-height:1.75}
.bubble.k{background:var(--ink2);border:1px solid var(--border);border-left:3px solid var(--gold);font-family:var(--serif);font-size:20px;font-weight:300}
.bubble.me{background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.18);font-size:16px;max-width:85%}
.typing{display:flex;gap:5px;padding:15px 17px;background:var(--ink2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:14px;width:fit-content;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:p 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes p{0%,60%,100%{opacity:.2;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}

.qps{display:flex;flex-wrap:wrap;gap:7px}
.qp{font-size:14px;color:var(--stone);padding:8px 15px;border:1px solid rgba(201,169,110,0.15);border-radius:20px;background:none;cursor:pointer;text-align:left;font-family:var(--sans)}

.bar{flex-shrink:0;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--ink2);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.wrap{flex:1;background:var(--ink3);border:1px solid rgba(201,169,110,0.2);border-radius:14px;padding:11px 13px;display:flex;align-items:flex-end}
.wrap:focus-within{border-color:rgba(201,169,110,0.5)}
textarea{flex:1;background:none;border:none;outline:none;color:var(--ivory);font-family:var(--sans);font-size:17px;font-weight:300;resize:none;line-height:1.5;min-height:26px;max-height:120px}
textarea::placeholder{color:rgba(138,122,96,0.55)}
.send{width:46px;height:46px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send:active{transform:scale(.93)}
.send:disabled{background:rgba(201,169,110,0.25);cursor:not-allowed}

.micbtn{width:46px;height:46px;border-radius:50%;background:var(--ink3);border:1px solid rgba(201,169,110,0.25);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.micbtn.listening{border-color:var(--gold);background:rgba(201,169,110,0.15);animation:mp 1s infinite}
@keyframes mp{0%,100%{box-shadow:0 0 0 0 rgba(201,169,110,0.4)}50%{box-shadow:0 0 0 8px rgba(201,169,110,0)}}
</style>
</head>
<body>
<div class="app">

<div class="topbar">
  <button class="back" onclick="location.href='index.html'">← Command</button>
  <div class="brand">K<em>airos</em></div>
  <div class="modes">
    <button class="mode on" onclick="setMode('strategy',this)">Strategy</button>
    <button class="mode" onclick="setMode('counsel',this)">Counsel</button>
    <button class="mode" onclick="setMode('coach',this)">Coach</button>
  </div>
</div>

<div class="modnav">
  <a href="m1.html" class="ml">Morning Briefing</a>
  <a href="m2.html" class="ml">Relationships</a>
  <a href="m3.html" class="ml">Decision Engine</a>
  <a href="m4.html" class="ml">Direction Correction</a>
  <a href="m5.html" class="ml">Partner Portal</a>
  <a href="m6.html" class="ml">Legacy Vault</a>
</div>

<div class="chat" id="chat">
  <div class="khead">
    <svg width="48" height="48" viewBox="0 0 52 52" fill="none">
      <polygon points="26,3 44,13 44,33 26,43 8,33 8,13" stroke="#C9A96E" stroke-width="1.5" fill="none"/>
      <path d="M26 17C26 17 20 23 21.5 28.5C22.5 32 24.5 34 26 34.5C27.5 34 29.5 32 30.5 28.5C32 23 26 17 26 17Z" fill="#C9A96E"/>
    </svg>
    <p class="kname">K<em>airos</em></p>
    <p class="ksub">Senior Strategic Advisor</p>
    <div class="laws">
      <span class="law">Function</span><span class="law">Flexibility</span>
      <span class="law">Alignment</span><span class="law">Cost Efficiency</span>
    </div>
  </div>

  <div id="msgs">
    <div class="msg">
      <span class="lbl">Kairos</span>
      <div class="bubble k">You have <span id="kdays"></span> days to $2.8B. What needs my attention today?</div>
    </div>
  </div>

  <div class="qps" id="qps">
    <button class="qp" onclick="useQ(this)">Most critical action today?</button>
    <button class="qp" onclick="useQ(this)">Evaluate DIAMODIA Phase 1</button>
    <button class="qp" onclick="useQ(this)">Cambodia — $24M floor or hold?</button>
    <button class="qp" onclick="useQ(this)">Path to Property reset</button>
    <button class="qp" onclick="useQ(this)">80/20 focus this week</button>
  </div>
</div>

<div class="bar">
  <div class="wrap">
    <textarea id="inp" placeholder="Ask Kairos…" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();go()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
  </div>
  <button class="micbtn" id="micbtn" onclick="toggleMic()" title="Voice">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9A96E" stroke-width="1.8" stroke-linecap="round">
      <path d="M12 2C10.3 2 9 3.3 9 5v6c0 1.7 1.3 3 3 3s3-1.3 3-3V5c0-1.7-1.3-3-3-3z"/>
      <path d="M19 10v1a7 7 0 01-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/>
    </svg>
  </button>
  <button class="send" id="sendbtn" onclick="go()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M22 2L11 13" stroke="#0A0906" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="#0A0906" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

</div>
<script>
var WORKER = 'https://kairos-proxy.chealykun25.workers.dev';
var MODEL  = 'claude-sonnet-4-6';
var SYS = 'You are Kairos, senior strategic advisor to Phoenix. Direct, surgical, no filler. Keep every response under 120 words. Lead with the answer. Cut everything else. Empire: DIAMODIA luxury Cambodian gemstone brand, $0.05M now, $2.8B target by 2036. Phase 1: Phoenix+Claude only, $4,700/mo. Critical: File PROVENANCE VERIFIED trademark at USPTO. Three children: Munica 14, TC 10, Vongsa 4. Father 73. 4am wake, 5 miles daily, Phoenix AZ, from Cambodia. Every answer: Function, Flexibility, Alignment, Cost efficiency. One or two options max. Start with the answer.';

var mode = 'strategy';
var busy = false;
var hist = [];

document.getElementById('kdays').textContent = Math.ceil((new Date('2036-06-01') - new Date()) / 86400000);

function setMode(m, el) {
  mode = m;
  document.querySelectorAll('.mode').forEach(function(b){ b.classList.remove('on'); });
  el.classList.add('on');
}

function useQ(btn) {
  document.getElementById('inp').value = btn.textContent;
  go();
}

function addMsg(who, text) {
  var msgs = document.getElementById('msgs');
  var d = document.createElement('div');
  d.className = who === 'me' ? 'msg me' : 'msg';
  var lbl = who === 'me' ? 'Phoenix' : 'Kairos';
  var cls = who === 'me' ? 'me' : 'k';
  var safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>');
  d.innerHTML = '<span class="lbl">'+lbl+'</span><div class="bubble '+cls+'">'+safe+'</div>';
  msgs.appendChild(d);
  setTimeout(function(){ document.getElementById('chat').scrollTop = 999999; }, 50);
}

function showTyping() {
  var msgs = document.getElementById('msgs');
  var d = document.createElement('div');
  d.className = 'msg'; d.id = 'typ';
  d.innerHTML = '<span class="lbl">Kairos</span><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  msgs.appendChild(d);
  setTimeout(function(){ document.getElementById('chat').scrollTop = 999999; }, 50);
}

function removeTyping() {
  var t = document.getElementById('typ');
  if (t) t.remove();
}

async function go() {
  var inp = document.getElementById('inp');
  var text = inp.value.trim();
  if (!text || busy) return;
  inp.value = ''; inp.style.height = 'auto';
  document.getElementById('qps').style.display = 'none';
  busy = true;
  document.getElementById('sendbtn').disabled = true;

  addMsg('me', text);
  hist.push({role:'user', content:text});
  showTyping();

  var modeCtx = mode === 'counsel' ? ' [Counsel mode: personal/family, be warmer]' : mode === 'coach' ? ' [Coach mode: support, reflect first]' : '';

  try {
    var res = await fetch(WORKER, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 350,
        system: SYS + modeCtx,
        messages: hist
      })
    });
    var data = await res.json();
    removeTyping();
    var reply = (data.content && data.content[0] && data.content[0].text)
      ? data.content[0].text
      : 'Error ' + res.status + ': ' + JSON.stringify(data).slice(0, 150);
    hist.push({role:'assistant', content:reply});
    addMsg('k', reply);
    speakOut(reply);
  } catch(err) {
    removeTyping();
    addMsg('k', 'Connection error: ' + err.message);
  }

  busy = false;
  document.getElementById('sendbtn').disabled = false;
  document.getElementById('inp').focus();
}

// Voice conversation
var rec = null;
var listening = false;
var speaking = false;
var synth = window.speechSynthesis;
var kVoice = null;

function loadVoice() {
  var voices = synth.getVoices();
  var prefs = ['Daniel','Alex','Google UK English Male','Microsoft David'];
  for (var p of prefs) {
    var v = voices.find(function(v){ return v.name.includes(p); });
    if (v) { kVoice = v; return; }
  }
  kVoice = voices.find(function(v){ return v.lang && v.lang.startsWith('en'); }) || voices[0];
}
if (synth) { synth.onvoiceschanged = loadVoice; setTimeout(loadVoice, 300); }

function speakOut(text) {
  if (!synth) return;
  synth.cancel();
  var clean = text.replace(/\*\*/g,'').replace(/\*/g,'').replace(/<[^>]*>/g,'').trim();
  var utt = new SpeechSynthesisUtterance(clean);
  utt.rate = 0.88; utt.pitch = 0.82; utt.volume = 1;
  if (kVoice) utt.voice = kVoice;
  speaking = true;
  utt.onend = function() { speaking = false; };
  utt.onerror = function() { speaking = false; };
  synth.speak(utt);
}

function toggleMic() {
  // If Kairos is speaking, stop him
  if (speaking) { synth && synth.cancel(); speaking = false; }
  // If already listening, stop
  if (listening) { rec && rec.stop(); return; }
  
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { addMsg('k', 'Voice input not supported. Try Chrome or Safari.'); return; }
  
  rec = new SR();
  rec.lang = 'en-US'; rec.continuous = false; rec.interimResults = true;
  
  rec.onstart = function() {
    listening = true;
    document.getElementById('micbtn').classList.add('listening');
    document.getElementById('inp').placeholder = 'Listening...';
  };
  rec.onresult = function(e) {
    var interim = '', final = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('inp').value = final || interim;
    if (final) { rec.stop(); go(); }
  };
  rec.onerror = function() {
    listening = false;
    document.getElementById('micbtn').classList.remove('listening');
    document.getElementById('inp').placeholder = 'Ask Kairos…';
  };
  rec.onend = function() {
    listening = false;
    document.getElementById('micbtn').classList.remove('listening');
    document.getElementById('inp').placeholder = 'Ask Kairos…';
  };
  rec.start();
}
</script>
</body>
</html>
