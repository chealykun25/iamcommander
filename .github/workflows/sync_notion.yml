name: Sync Empire Data from Notion

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Empire database from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os, sys

          token = os.environ.get('NOTION_TOKEN','')
          db_id = os.environ.get('NOTION_DB_ID','')
          if not token or not db_id:
              print("Missing secrets"); sys.exit(0)

          H = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2022-06-28",
              "Content-Type": "application/json"
          }

          def query(filter_type, page_size=50):
              body = {
                  "page_size": page_size,
                  "filter": {"property":"Type","select":{"equals":filter_type}},
                  "sorts": [{"timestamp":"last_edited_time","direction":"descending"}]
              }
              req = urllib.request.Request(
                  f"https://api.notion.com/v1/databases/{db_id}/query",
                  data=json.dumps(body).encode(), headers=H, method="POST"
              )
              return json.loads(urllib.request.urlopen(req, timeout=15).read()).get('results',[])

          def txt(p):
              if not p: return ''
              for k in ['rich_text','title']:
                  if p.get(k) and p[k]: return p[k][0].get('plain_text','')
              if p.get('select') and p['select']: return p['select']['name']
              if p.get('number') is not None: return str(p['number'])
              return ''

          # ── Daily row ────────────────────────────────────────────────
          daily = query('Daily', 1)
          dash = {}
          if daily:
              p = daily[0]['properties']
              dash = {
                  "score":      int(float(txt(p.get('Score')) or 62)),
                  "nw":         txt(p.get('Net Worth'))    or "$0.05M",
                  "action":     txt(p.get('Next Action'))  or "",
                  "action_div": "Commerce · Veritan",
                  "phase":      "Phase 1",
                  "burn":       "$4,700/mo",
              }

          # ── Projects ─────────────────────────────────────────────────
          projects = []
          exceptions = []
          for row in query('Project', 50):
              p = row['properties']
              signal = txt(p.get('Signal')) or 'Green'
              proj = {
                  "name":    txt(p.get('Name')),
                  "div":     txt(p.get('Division')),
                  "signal":  signal,
                  "kpi":     txt(p.get('KPI')),
                  "action":  txt(p.get('Next Action')),
                  "owner":   txt(p.get('Owner')),
                  "status":  txt(p.get('Status')),
              }
              projects.append(proj)
              if signal == 'Red':
                  exceptions.append(txt(p.get('Name')) + ' — ' + txt(p.get('Next Action')))

          # ── People ───────────────────────────────────────────────────
          people = []
          for row in query('Person', 20):
              p = row['properties']
              people.append({
                  "name":        txt(p.get('Name')),
                  "kpi":         txt(p.get('KPI')),
                  "next_action": txt(p.get('Next Action')),
                  "signal":      txt(p.get('Signal')),
              })

          # ── Build data.json ──────────────────────────────────────────
          data = {
              **dash,
              "exception1":  exceptions[0] if len(exceptions) > 0 else "",
              "exception2":  exceptions[1] if len(exceptions) > 1 else "",
              "projects":    projects,
              "people":      people,
              "updated":     daily[0].get('last_edited_time','') if daily else ""
          }

          with open('data.json','w') as f:
              json.dump(data, f, indent=2)

          print(f"Synced: {len(projects)} projects, {len(people)} people")
          print(f"Exceptions: {exceptions}")
          EOF

      - name: Commit if changed
        run: |
          git config user.email "kairos@diamodia.com"
          git config user.name "Kairos"
          git add data.json
          git diff --staged --quiet || (git commit -m "Auto-sync: Notion → data.json" && git push)
