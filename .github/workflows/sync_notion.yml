name: Sync Empire Data from Notion

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Write sync script
        run: |
          cat > /tmp/sync.py << 'EOF'
import urllib.request, urllib.error, json, os, sys

token = os.environ.get('NOTION_TOKEN','')
db_id = os.environ.get('NOTION_DB_ID','')

if not token or not db_id:
    print("ERROR: Missing NOTION_TOKEN or NOTION_DB_ID secrets")
    sys.exit(1)

print(f"Token: {token[:15]}...")
print(f"DB ID: {db_id}")

H = {
    "Authorization": "Bearer " + token,
    "Notion-Version": "2022-06-28",
    "Content-Type": "application/json"
}

def query(filter_type=None, page_size=50):
    body = {"page_size": page_size}
    if filter_type:
        body["filter"] = {"property":"Type","select":{"equals":filter_type}}
    req = urllib.request.Request(
        "https://api.notion.com/v1/databases/" + db_id + "/query",
        data=json.dumps(body).encode(), headers=H, method="POST"
    )
    try:
        resp = urllib.request.urlopen(req, timeout=15)
        data = json.loads(resp.read())
        print(f"Query '{filter_type}': {len(data.get('results',[]))} rows")
        return data.get('results', [])
    except urllib.error.HTTPError as e:
        body = e.read().decode()
        print(f"HTTP Error {e.code}: {body}")
        sys.exit(1)
    except Exception as ex:
        print(f"Error: {ex}")
        sys.exit(1)

def txt(p):
    if not p: return ''
    for k in ['rich_text','title']:
        if p.get(k) and p[k]: return p[k][0].get('plain_text','')
    if p.get('select') and p['select']: return p['select']['name']
    if p.get('number') is not None: return str(p['number'])
    return ''

daily    = query('Daily', 1)
projects = query('Project', 50)
people   = query('Person', 20)

dash = {}
if daily:
    p = daily[0]['properties']
    dash = {
        "score":  int(float(txt(p.get('Score')) or 62)),
        "nw":     txt(p.get('Net Worth'))   or "$0.05M",
        "action": txt(p.get('Next Action')) or "",
    }

projs = []
exceptions = []
for row in projects:
    p = row['properties']
    sig = txt(p.get('Signal')) or 'Green'
    name = txt(p.get('Name'))
    action = txt(p.get('Next Action'))
    projs.append({"name":name,"div":txt(p.get('Division')),"signal":sig,"kpi":txt(p.get('KPI')),"action":action,"owner":txt(p.get('Owner')),"status":txt(p.get('Status'))})
    if sig == 'Red':
        exceptions.append(name + ' — ' + action)

ppl = []
for row in people:
    p = row['properties']
    ppl.append({"name":txt(p.get('Name')),"kpi":txt(p.get('KPI')),"next_action":txt(p.get('Next Action')),"signal":txt(p.get('Signal'))})

data = {**dash,"action_div":"Commerce · Veritan","phase":"Phase 1","burn":"$4,700/mo","exception1":exceptions[0] if exceptions else "","exception2":exceptions[1] if len(exceptions)>1 else "","projects":projs,"people":ppl,"updated":daily[0].get('last_edited_time','') if daily else ""}

with open('data.json','w') as f:
    json.dump(data, f, indent=2)
print("SUCCESS: data.json updated")
EOF

      - name: Run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: python3 /tmp/sync.py

      - name: Commit if changed
        run: |
          git config user.email "kairos@diamodia.com"
          git config user.name "Kairos"
          git add data.json
          git diff --staged --quiet || (git commit -m "Auto-sync: Notion to data.json" && git push)
