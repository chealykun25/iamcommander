name: Sync Empire Data from Notion

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync Notion to data.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: python3 sync_notion.py

      - name: Commit if changed
        run: |
          git config user.email "kairos@diamodia.com"
          git config user.name "Kairos"
          git add data.json
          git diff --staged --quiet || (git commit -m "Auto-sync: Notion to data.json" && git push)
